<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="./src/styles/style.css" />
    <link rel="icon" href="./src/assets/images/logotab.png" />
    <title>Projects — Arya Krisna Putra</title>
  </head>
  <body>
    <!-- NAV — rendered by JS -->
    <div id="nav-root"></div>

    <!-- PAGE HEADER -->
    <section class="page-header">
      <div class="page-header-inner">
        <a href="./index.html" class="back-link"><span>←</span> Back to Home</a>
        <p class="section-label">PORTFOLIO</p>
        <h1 class="page-header-title">All Projects</h1>
        <p class="page-header-desc">
          A complete list of projects I've built — from industry work to personal experiments and academic assignments.
        </p>
      </div>
    </section>

    <!-- FILTER -->
    <div class="projects-page-filter">
      <div class="projects-page-filter-inner">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Professional">Professional</button>
        <button class="filter-btn" data-filter="Personal">Personal</button>
        <button class="filter-btn" data-filter="Academic">Academic</button>
        <button class="filter-btn" data-filter="In Progress">In Progress</button>
      </div>
    </div>

    <!-- PROJECT GRID -->
    <section class="projects-page">
      <div class="projects-page-inner">
        <div class="projects-grid" id="projects-grid">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- FOOTER — rendered by JS -->
    <div id="footer-root"></div>

    <script src="./src/projects.js" type="module"></script>
  </body>
</html>
